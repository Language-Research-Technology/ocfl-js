pre-commit:
  parallel: true
  jobs:
    - name: biome
      run: pnpm run lint:biome

    - name: knip
      run: pnpm run lint:knip

    - name: types
      run: pnpm run lint:types

    # Sequential: both write dist/
    - name: build
      group:
        jobs:
          - name: consumer
            run: pnpm run lint:consumer

          - name: api
            run: pnpm run lint:api

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
