name: Bug report
description: Something in @ocfl/ocfl-fs doesn't work as documented
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: To report a security vulnerability, don't use this form. Follow [SECURITY.md](https://github.com/Language-Research-Technology/ocfl-js/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the full error message and its `code`, if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest code that shows the problem, and the storage root or object it runs against if that matters.
      render: ts
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: "@ocfl/ocfl-fs version"
      description: The output of `pnpm list @ocfl/ocfl-fs`
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "22.18.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and filesystem
      placeholder: Ubuntu 24.04, ext4
