version: 2
# Security updates only: a limit of 0 disables version-update PRs, while security-update PRs still
# open under the repo's "Dependabot security updates" setting and use this file's commit-message.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
      include: scope

  # Covers the whole pnpm workspace, website included
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
