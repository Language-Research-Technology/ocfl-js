name: Run Tests

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Only pull requests share a group; runs called from publish.yml are never cancelled
concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint needs the PR's commits
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (biome)
        run: pnpm lint:biome
      - name: Lint (types)
        run: pnpm lint:types
      - name: Lint (knip)
        run: pnpm lint:knip
      - name: Lint (consumer)
        run: pnpm lint:consumer
      - name: Lint (API)
        run: pnpm lint:api
      - name: Lint (docs)
        run: pnpm lint:docs
      - name: Lint (workflows, actionlint)
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Lint (workflows, zizmor)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true
      - name: Lint (commit messages)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22, 24, 26]
    env:
      # Otherwise pnpm run installs the whole workspace, site toolchain included
      pnpm_config_verify_deps_before_run: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # The site's dependencies aren't needed to test the library
      - run: pnpm install --frozen-lockfile --filter @ocfl/ocfl-fs
      - run: pnpm test
        if: matrix.node-version != 24
      - run: pnpm coverage
        if: matrix.node-version == 24
