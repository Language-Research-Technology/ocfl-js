# Publish library to the registry
name: Publish

on:
  workflow_run:
    workflows: [Run Tests]
    types: [completed]
    branches: [master, main]

permissions: write-all

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        package: [ocfl, ocfl-fs]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - uses: ButlerLogic/action-autotag@1.1.2
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          root: ./${{ matrix.package }}
          tag_prefix: "${{ matrix.package }}-v"
        id: create_tag
      # - run: echo ${{ steps.create_tag.outputs.tagname }}
      # - run: echo ${{ steps.create_tag.outputs.version }}
      - name: Check if a new tag is created
        run: "[[ '${{ steps.create_tag.outputs.tagname }}' ]]"
      - run: pnpm install --frozen-lockfile
      - name: Publish package on NPM
        run: pnpm publish --access public --no-git-checks --filter ./${{ matrix.package }}
