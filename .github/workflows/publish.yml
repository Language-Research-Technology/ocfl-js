name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Stable (semantic-release, latest) or prerelease (X.Y.Z-beta.N, beta)"
        required: true
        default: stable
        type: choice
        options: [stable, prerelease]
      dry_run:
        description: "Dry run (show the version and package contents without publishing)"
        required: false
        default: true
        type: boolean

jobs:
  # workflow_dispatch can't hide its branch picker
  check-ref:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Refuse a run from a branch other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Publish Packages from main"
          exit 1

  test:
    needs: check-ref
    uses: ./.github/workflows/test.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-latest
    # npm's trusted publisher only accepts OIDC tokens from this environment
    environment: npm-publish
    # Prereleases count from the tags, so two at once could pick the same number. Per kind, because a
    # group holds one pending run, and a queued prerelease mustn't displace a queued stable release.
    concurrency:
      group: publish-${{ inputs.release }}
      cancel-in-progress: false
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # for npm trusted publishing and provenance
    outputs:
      release-tag: ${{ steps.semantic-release.outputs.tag }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_CONFIG_PROVENANCE: true
      # Otherwise pnpm exec installs the whole workspace, site toolchain included
      pnpm_config_verify_deps_before_run: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # to push the release tag

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @ocfl/ocfl-fs

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures

      - name: Semantic Release (dry-run)
        if: inputs.release == 'stable' && inputs.dry_run
        run: |
          pnpm exec semantic-release --dry-run
          pnpm pack --dry-run

      # release.config.mjs sets the tag output only when a release succeeds
      - name: Semantic Release
        id: semantic-release
        if: inputs.release == 'stable' && !inputs.dry_run
        run: pnpm exec semantic-release

      - name: Prerelease (dry-run)
        if: inputs.release == 'prerelease' && inputs.dry_run
        run: pnpm publish:prerelease --dry-run

      - name: Prerelease
        if: inputs.release == 'prerelease' && !inputs.dry_run
        run: pnpm publish:prerelease

  site:
    needs: publish
    # A tag means the release happened, even if a later step (e.g. a GitHub comment) failed the job
    if: ${{ always() && needs.publish.outputs.release-tag != '' }}
    uses: ./.github/workflows/site.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      ref: ${{ needs.publish.outputs.release-tag }}
