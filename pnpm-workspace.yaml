packages:
  - .
  - website

update:
  githubActions: true

autoDedupe: true
saveTypes: true
engineStrict: true

allowBuilds:
  # Installs the git hooks.
  lefthook: true
  # The site's Vite pulls it in. Its build script only checks its platform binary, which pnpm installs as an optional dependency.
  esbuild: false
